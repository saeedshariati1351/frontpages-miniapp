name: post
# Sends (or edits) the nightly shareable post with today's top headlines to the
# channel «صفحه نخست جهان» (owner's chat until the bot is a channel admin).
# Runs when data/posts/<date>.json is pushed, hourly (sends today's post if it
# has not reached the channel yet; otherwise does nothing), and by hand.
on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: [data/posts/**]
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (default: latest day)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        run: python3 scripts/post.py ${{ github.event.inputs.date }} ${{ github.event_name == 'schedule' && '--today-only' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/post-state.json data/channel.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "post: today's message id"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
