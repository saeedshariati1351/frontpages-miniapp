name: post
# Sends (or edits) the nightly shareable post with today's top headlines to the
# bot's chat. Runs when data/posts/<date>.json is pushed; can be run by hand.
on:
  push:
    branches: [main]
    paths: [data/posts/**]
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (default: latest day)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        run: python3 scripts/post.py ${{ github.event.inputs.date }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post-state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "post: today's message id"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
