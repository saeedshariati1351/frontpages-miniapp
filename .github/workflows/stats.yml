name: stats
# Reads the Mini App's monthly users (Telegram's own count, via MTProto as the
# bot) and saves it to data/stats.json, shown in the app's footer.
# Needs secrets TELEGRAM_BOT_TOKEN, TG_API_ID, TG_API_HASH. By hand only for now.
on:
  # schedule turned off for now (Telegram does not return the count to the bot):
  # schedule:
  #   - cron: "17 4,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q telethon
      - run: python3 scripts/fetch_stats.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "stats: monthly users"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
