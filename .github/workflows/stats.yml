name: stats
# Reads the Mini App's monthly users from the bot's public t.me page and saves
# it to data/stats.json (shown in the app's footer). Twice a day and by hand.
on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_stats.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "stats: monthly users"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
