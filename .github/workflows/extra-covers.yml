name: extra-covers
# Front pages not available on frontpages.com (e.g. Asharq Al-Awsat), fetched
# from the newspapers' own sites. Triggered by the daily update before the
# headlines are written; can also be run by hand with a list of dates.
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates YYYY-MM-DD separated by spaces (default: today in Tehran)"
        required: false
        default: ""
      urls:
        description: "Direct cover files for papers with via=url: slug=YYYY-MM-DD=URL, space separated"
        required: false
        default: ""
      probe:
        description: "Debug: URLs to inspect (nothing is fetched or committed)"
        required: false
        default: ""
      debug:
        description: "Print SVG debug info"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: extra-covers
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow pymupdf
      - name: Fetch
        run: |
          DATES="${{ github.event.inputs.dates }}"
          [ -z "$DATES" ] && DATES=$(TZ=Asia/Tehran date +%F)
          if [ -n "${{ github.event.inputs.probe }}" ]; then python3 scripts/fetch_extra.py --probe ${{ github.event.inputs.probe }}; exit 0; fi
          URLS=""
          for x in ${{ github.event.inputs.urls }}; do URLS="$URLS --url $x"; done
          python3 scripts/fetch_extra.py $DATES $URLS
        env:
          DEBUG_SVG: ${{ github.event.inputs.debug }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers data
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Extra covers ${{ github.event.inputs.dates }}"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
